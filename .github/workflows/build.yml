name: Build Maine Government Feeds

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 */6 * * *"
  # NOTE: update this branch name if you rename/replace the repository's default branch.
  push:
    branches: [main]
    paths:
      - "sources.yml"
      - "roles.yml"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Role classification backend selection (first available wins):
      # ANTHROPIC_API_KEY -> Claude; OPENAI_API_KEY -> OpenAI; neither ->
      # offline keyword heuristic. The heuristic fallback means the curated
      # practice-area role feeds are ALWAYS published — keyword-quality role
      # feeds beat publishing none at all.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feeds
        run: python scripts/build_feeds.py

      # Fail-soft role classification: tag new items into practitioner roles
      # (incremental + cached in state) and build the per-role curated feeds.
      # Backend picked by available secrets; falls back to the offline keyword
      # heuristic so role feeds always publish. The classifier exits 0 on any
      # API error, so this never breaks the core build.
      - name: Classify items and build curated role feeds
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then BACKEND=anthropic
          elif [ -n "$OPENAI_API_KEY" ]; then BACKEND=openai
          else BACKEND=heuristic; fi
          echo "Classification backend: $BACKEND"
          python scripts/classify_items.py --backend "$BACKEND"
          python scripts/build_role_feeds.py

      # Firm knowledge-pipeline export: newline-delimited JSON of observed
      # items (text + structured metadata + role tags). Written to a
      # gitignored file and published as a workflow artifact so multi-MB
      # regenerations never bloat the repo or GitHub Pages.
      - name: Export corpus for firm data pipeline
        run: python scripts/write_corpus.py

      - name: Upload corpus artifact
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus.jsonl
          retention-days: 90

      # Validation runs LAST so its RSS-profile lint covers the role feeds too,
      # and so the provenance manifest it writes covers every published file.
      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit and push generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/state/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update feeds [automated]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Source-health watcher: open/update/close a single tracking issue for
      # sources that have failed for several consecutive builds. Fail-soft and
      # uses only the built-in GITHUB_TOKEN.
      - name: Reconcile source-health issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_FAIL_THRESHOLD: "3"
        run: python scripts/health_watch.py

      # Best-effort WebSub push: tell the public hub which Atom feeds changed
      # this run so push-capable readers (Inoreader, FreshRSS + WebSub plugin)
      # get new items in seconds instead of on their next poll. The Atom feeds
      # advertise this hub via <link rel="hub">. Never fails the build.
      - name: Ping WebSub hub for changed feeds
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          BASE="https://bedardandy.github.io/maine-government-feeds"
          git diff --name-only HEAD~1 HEAD -- docs/feeds/atom | head -50 | while read -r f; do
            url="$BASE/feeds/atom/$(basename "$f")"
            curl -sS -m 15 -o /dev/null -w "websub %{http_code} $url\n" \
              -d "hub.mode=publish" --data-urlencode "hub.url=$url" \
              "https://pubsubhubbub.superfeedr.com/" || true
          done

      # Best-effort third-party timestamping: ask the Internet Archive's
      # Save Page Now to snapshot the key published artifacts whenever they
      # changed. This gives a neutral, externally-verifiable record of when
      # each build's content was live, complementing the git history.
      # Never fails the build (SPN is rate-limited and occasionally down).
      - name: Archive published site to the Wayback Machine
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          for url in \
            "https://bedardandy.github.io/maine-government-feeds/" \
            "https://bedardandy.github.io/maine-government-feeds/feeds/json/catalog.json" \
            "https://bedardandy.github.io/maine-government-feeds/calendar/all-feeds.ics"; do
            curl -sS -m 60 -o /dev/null -w "SPN %{http_code} $url\n" \
              "https://web.archive.org/save/$url" || true
            sleep 5
          done
