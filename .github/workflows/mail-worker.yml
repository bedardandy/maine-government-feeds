name: Mail Worker

# Tests the email-bulletin Worker in mail/ on every change, and deploys it to
# Cloudflare from main. Nothing here touches the feed build.
#
# Deploying needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped to this account: Workers (edit), Workers KV
#                          (edit), and Email Routing rules (edit) on the zone
#   CLOUDFLARE_ACCOUNT_ID
# Without them the deploy step is skipped and only the tests run.

on:
  pull_request:
    paths:
      - "mail/**"
      - ".github/workflows/mail-worker.yml"
  push:
    branches: [main]
    paths:
      - "mail/**"
      - ".github/workflows/mail-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mail-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mail
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mail/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            exit 0
          fi
          npx wrangler deploy
